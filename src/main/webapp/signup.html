<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="3;url=login.html">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkPulse — Account Creation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #f8fafc;
    color: #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 18px;
    padding: 36px 32px;
    max-width: 460px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06);
  }
  .icon-box {
    width: 56px;
    height: 56px;
    background: #eff6ff;
    color: #2563eb;
    border-radius: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 10px;
    color: #0f172a;
  }
  p {
    font-size: 14px;
    color: #64748b;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #2563eb;
    color: #ffffff;
    padding: 12px 24px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    transition: background 0.15s;
  }
  .btn:hover {
    background: #1d4ed8;
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon-box">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
  </div>
  <h1>Self Sign-Up Disabled</h1>
  <p>
    Public self-registration is closed. All Employee and Manager accounts are provisioned exclusively by HR Administration with automated temporary credentials.
  </p>
  <a href="login.html" class="btn">
    Go to Sign In &rarr;
  </a>
</div>
</body>
</html>
